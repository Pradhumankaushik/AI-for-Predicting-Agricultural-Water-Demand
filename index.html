<!DOCTYPE html>
<html>
<head>
    <title>AI Water Demand Predictor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-top: 15px;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background: #2979ff;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 6px;
        }

        button:hover {
            background: #1558d6;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            border-radius: 6px;
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                margin: 10px;
            }
            button {
                font-size: 14px;
                padding: 10px;
            }
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Water Demand Predictor</h2>

    <label>Crop</label>
    <select id="crop">
    <option>Wheat</option>
    <option>Rice</option>
    <option>Maize</option>
    <option>Sugarcane</option>
    <option>Cotton</option>
    <option>Millet</option>
    <option>Sorghum</option>
    <option>Potato</option>
    <option>Soybean</option>
    <option>Groundnut</option>
    <option>Sunflower</option>
</select>


    <label>Temperature (°C)</label>
    <input type="number" id="temp" value="32">

    <label>Humidity (%)</label>
    <input type="number" id="humidity" value="60">

    <label>Rainfall (mm)</label>
    <input type="number" id="rain" value="0">

    <button onclick="predict()">Predict</button>

    <div class="result" id="resultBox">
        <b>Predicted Water Requirement:</b>
        <p id="output"></p>
    </div>
</div>

<script>
function predict() {
    let crop = document.getElementById("crop").value;
    let temp = Number(document.getElementById("temp").value);
    let humidity = Number(document.getElementById("humidity").value);
    let rain = Number(document.getElementById("rain").value);

    // base formula
    let base = temp * 0.2 + (100 - humidity) * 0.1 - rain * 0.3;

    // crop water coefficients (Kc)
    let kcValues = {
        "Wheat": 0.85,
        "Rice": 1.20,
        "Maize": 1.00,
        "Sugarcane": 1.25,
        "Cotton": 0.95,
        "Millet": 0.70,
        "Sorghum": 0.75,
        "Potato": 1.10,
        "Soybean": 0.90,
        "Groundnut": 0.85,
        "Sunflower": 0.95
    };

    let kc = kcValues[crop] || 1;  // default if missing
    let water = base * kc;

    if (water < 0) water = 0;

    document.getElementById("output").innerText =
        water.toFixed(1) + " mm/day";

    document.getElementById("resultBox").style.display = "block";
}
</script>



</body>
</html>
